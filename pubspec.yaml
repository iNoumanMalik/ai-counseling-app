name: semester_project
description: "A mental wellness app with self-help tools, counselor references, and daily motivation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.6.0
  http: ^1.2.1

  # Icons
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.6.1
  
  # Storage
  shared_preferences: ^2.3.4
  
  # Animations
  lottie: ^3.1.3
  rive: ^0.13.19
  flutter_animate: ^4.5.0
  
  # 3D Models
  model_viewer_plus: ^1.4.7
  
  # Audio
  audioplayers: ^6.1.0
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Charts & Graphs
  fl_chart: ^0.69.2
  
  # URL Launcher
  url_launcher: ^6.3.1
  
  # Intl for date formatting
  intl: ^0.19.0
  
  # Confetti animations
  confetti: ^0.8.0
  
  # PDF viewer
  # pdfx: ^2.1.1  # TODO: Uncomment if PDF viewing is needed, and configure pdf.js in web/index.html
  
  # Markdown renderer
  flutter_markdown: ^0.6.18+1
  
  # UUID generator
  uuid: ^4.5.1
  
  # HTTP for future integrations (placeholder)
  # http: ^1.2.2  # TODO: Add when backend integration is needed

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
 


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/rive/
    - assets/models/
    - assets/audio/
    - assets/pdf/
    - assets/data/
    - assets/icons/

